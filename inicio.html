<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  z-index: 5;
  background: linear-gradient(#0009, transparent);
}

.logo {
  color: #00e5ff;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
}

.feed {
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.feed::-webkit-scrollbar {
  display: none;
}

.post {
  height: 100dvh;
  width: 100%;
  position: relative;
  scroll-snap-align: start;
  background: linear-gradient(160deg, #202b3b, #090909);
}

.video-real {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
  background: #000;
}

.post:nth-child(2) {
  background: linear-gradient(160deg, #35203b, #090909);
}

.post:nth-child(3) {
  background: linear-gradient(160deg, #183c35, #090909);
}

.video-text {
  position: absolute;
  top: 45%;
  width: 100%;
  text-align: center;
  color: #aaa;
}

.actions {
  position: absolute;
  right: 15px;
  bottom: 125px;
  display: flex;
  flex-direction: column;
  gap: 25px;
  text-align: center;
}

.actions span {
  font-size: 27px;
}

.actions small {
  font-size: 12px;
}

.info {
  position: absolute;
  bottom: 90px;
  left: 15px;
}

.info p {
  margin-top: 8px;
  font-size: 14px;
}

nav {
  position: fixed;
  bottom: 0;
  height: 60px;
  width: 100%;
  background: #101010;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 5;
}

nav span {
  font-size: 12px;
  text-align: center;
}

nav b {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}

.like-btn {
  background: none;
  border: none;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.like-btn small {
  display: block;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXORA</div>
  <div>⌕</div>
</header>

<main class="feed">

  <section class="post">
    <video class="video-real" autoplay muted playsinline loop>
      <source src="20261002_153916_001.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>
    <div class="actions">
      <button class="like-btn" data-post-id="video1" onclick="darLike(this)">
        ♡ <small>0</small>
      </button>
      <span>▢<small>0</small></span>
      <span>↗<small>Compartir</small></span>
    </div>
    <div class="info">
      <strong>@nexora</strong>
      <p>Bienvenido a NEXORA 🚀</p>
    </div>
  </section>

  <section class="post">
    <video class="video-real" autoplay muted playsinline loop>
      <source src="20261002_155338_001.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>
    <div class="actions">
      <button class="like-btn" data-post-id="Video2" onclick="darLike(this)">
        ♡ <small>0</small>
      </button>
      <span>▢<small>0</small></span>
      <span>↗<small>Compartir</small></span>
    </div>
    <div class="info">
      <strong>@usuario</strong>
      <p>Una nueva publicación</p>
    </div>
  </section>

  <section class="post">
    <div class="actions">
      <button class="like-btn" data-post-id="video3" onclick="darLike(this)">
        ♡ <small>0</small>
      </button>
      <span>▢<small>0</small></span>
      <span>↗<small>Compartir</small></span>
    </div>
    <div class="info">
      <strong>@usuario</strong>
      <p>Descubre NEXORA</p>
    </div>
  </section>

</main>

<nav>
  <span><b>⌂</b>Inicio</span>
  <span><b>⌕</b>Buscar</span>
  <span><b>＋</b>Crear</span>
  <span><b>♡</b>Actividad</span>
  <span><b>♙</b>Perfil</span>
</nav>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  onSnapshot,
  setDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAbLF8HxEFCGkn00Mzn_Q3JOPOc2lSkk7Y",
  authDomain: "nexora-c7a6f.firebaseapp.com",
  projectId: "nexora-c7a6f",
  storageBucket: "nexora-c7a6f.firebasestorage.app",
  messagingSenderId: "322230049221",
  appId: "1:322230049221:web:c54317e2aafd0a620053ac"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// Reproducción de videos

const videos = document.querySelectorAll(".video-real");

const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    const video = entry.target;

    if (entry.isIntersecting) {
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  });
}, {
  threshold: 0.6
});

videos.forEach((video) => {
  observer.observe(video);
});


// Sistema de Me gusta con Firebase

const botones = document.querySelectorAll(".like-btn");

botones.forEach((button) => {
  button.disabled = true;
});

let usuarioActual = null;

async function darLike(button) {

  if (!usuarioActual || button.disabled) {
    return;
  }

  const postId = button.dataset.postId;
  const userId = usuarioActual.uid;

  const referencia = doc(
    db,
    "publicaciones",
    postId,
    "likes",
    userId
  );

  button.disabled = true;

  try {

    if (button.dataset.liked === "true") {

      await deleteDoc(referencia);

    } else {

      await setDoc(referencia, {
        uid: userId,
        createdAt: serverTimestamp()
      });

    }

  } catch (error) {

    console.error("Error al guardar Me gusta:", error);
    alert("No se pudo guardar el Me gusta. Inténtalo de nuevo.");

  } finally {

    button.disabled = false;

  }
}

window.darLike = darLike;


// Comprobar sesión y escuchar los Me gusta

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  usuarioActual = user;

  botones.forEach((button) => {

    const postId = button.dataset.postId;

    const likesRef = collection(
      db,
      "publicaciones",
      postId,
      "likes"
    );

    onSnapshot(likesRef, (snapshot) => {

      const total = snapshot.size;

      const miLike = snapshot.docs.some(
        (documento) => documento.id === user.uid
      );

      button.dataset.liked = miLike ? "true" : "false";

      const contador = button.querySelector("small");

      contador.textContent = total;

      button.firstChild.textContent = miLike ? "♥ " : "♡ ";

      button.style.color = miLike ? "#ff2d55" : "white";

      button.disabled = false;

    }, (error) => {

      console.error("Error al leer Me gusta:", error);
      button.disabled = true;

    });

  });

});

</script>

</body>
</html>
