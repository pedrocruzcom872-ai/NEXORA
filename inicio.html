<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  z-index: 5;
  background: linear-gradient(#0009, transparent);
}

.logo {
  color: #00e5ff;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
}

.feed {
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.feed::-webkit-scrollbar {
  display: none;
}

.post {
  height: 100dvh;
  width: 100%;
  position: relative;
  scroll-snap-align: start;
  background: linear-gradient(160deg, #202b3b, #090909);
}
.video-real {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
  background: #000;
  }
.post:nth-child(2) {
  background: linear-gradient(160deg, #35203b, #090909);
}

.post:nth-child(3) {
  background: linear-gradient(160deg, #183c35, #090909);
}

.video-text {
  position: absolute;
  top: 45%;
  width: 100%;
  text-align: center;
  color: #aaa;
}

.actions {
  position: absolute;
  right: 15px;
  bottom: 125px;
  display: flex;
  flex-direction: column;
  gap: 25px;
  text-align: center;
}

.actions span {
  font-size: 27px;
}

.actions small {
  font-size: 12px;
}

.info {
  position: absolute;
  bottom: 90px;
  left: 15px;
}

.info p {
  margin-top: 8px;
  font-size: 14px;
}

nav {
  position: fixed;
  bottom: 0;
  height: 60px;
  width: 100%;
  background: #101010;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 5;
}

nav span {
  font-size: 12px;
  text-align: center;
}

nav b {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXORA</div>
  <div>⌕</div>
</header>

<main class="feed">

  <section class="post">
    
    <div class="actions">
      <span>♡<small>0</small></span>
      <span>▢<small>0</small></span>
      <span>↗<small>Compartir</small></span>
    </div>
    <div class="info">
      <strong>@nexora</strong>
      <p>Bienvenido a NEXORA 🚀</p>
    </div>
  </section>
<video class="video-real" controls playsinline loop>
  <source src="20261002_153916_001.mp4" type="video/mp4">
  Tu navegador no puede reproducir este video.
</video>
  <section class="post">
    <div class="video-text">
      <h2>Segundo video</h2>
      <p>Espacio para una publicación</p>
    </div>
    <div class="actions">
      <span>♡<small>0</small></span>
      <span>▢<small>0</small></span>
      <span>↗<small>Compartir</small></span>
    </div>
    <div class="info">
      <strong>@usuario</strong>
      <p>Una nueva publicación</p>
    </div>
  </section>

  <section class="post">
    <div class="video-text">
      <h2>Tercer video</h2>
      <p>Más contenido próximamente</p>
    </div>
    <div class="actions">
      <span>♡<small>0</small></span>
      <span>▢<small>0</small></span>
      <span>↗<small>Compartir</small></span>
    </div>
    <div class="info">
      <strong>@usuario</strong>
      <p>Descubre NEXORA</p>
    </div>
  </section>

</main>

<nav>
  <span><b>⌂</b>Inicio</span>
  <span><b>⌕</b>Buscar</span>
  <span><b>＋</b>Crear</span>
  <span><b>♡</b>Actividad</span>
  <span><b>♙</b>Perfil</span>
</nav>

</body>
</html>
