
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: #111;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #00e5ff;
  letter-spacing: 2px;
}

.feed {
  height: calc(100vh - 120px);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}

.video-placeholder {
  width: 100%;
  height: 100%;
  max-width: 420px;
  border-radius: 15px;
  background: #191919;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.play {
  font-size: 55px;
  color: #00e5ff;
}

nav {
  height: 60px;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid #292929;
}

nav span {
  font-size: 13px;
  color: #ddd;
  text-align: center;
}

nav b {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NEXORA</div>
  <div>⌕</div>
</header>

<main class="feed">
  <div class="video-placeholder">
    <div class="play">▶</div>
    <h2>Bienvenido a NEXORA</h2>
    <p>Próximamente encontrarás videos aquí.</p>
  </div>
</main>

<nav>
  <span><b>⌂</b>Inicio</span>
  <span><b>⌕</b>Buscar</span>
  <span><b>＋</b>Crear</span>
  <span><b>♡</b>Actividad</span>
  <span><b>♙</b>Perfil</span>
</nav>

</body>
</html>
