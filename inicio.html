<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  z-index: 5;
  background: linear-gradient(#0009, transparent);
}

.logo {
  color: #00e5ff;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
}

.feed {
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.feed::-webkit-scrollbar {
  display: none;
}

.post {
  height: 100dvh;
  width: 100%;
  position: relative;
  scroll-snap-align: start;
  background: linear-gradient(160deg, #202b3b, #090909);
}

.video-real {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0;
  left: 0;
  background: #000;
}

.post:nth-child(2) {
  background: linear-gradient(160deg, #35203b, #090909);
}

.post:nth-child(3) {
  background: linear-gradient(160deg, #183c35, #090909);
}

.actions {
  position: absolute;
  right: 15px;
  bottom: 125px;
  display: flex;
  flex-direction: column;
  gap: 25px;
  text-align: center;
}

.actions span {
  font-size: 27px;
}

.actions small {
  display: block;
  font-size: 12px;
}

.info {
  position: absolute;
  bottom: 90px;
  left: 15px;
}

.info p {
  margin-top: 8px;
  font-size: 14px;
}

nav {
  position: fixed;
  bottom: 0;
  height: 60px;
  width: 100%;
  background: #101010;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 5;
}

nav button {
  background: none;
  border: none;
  color: white;
  font-size: 12px;
  text-align: center;
  cursor: pointer;
}

nav b {
  display: block;
  font-size: 21px;
  margin-bottom: 3px;
}

.like-btn {
  background: none;
  border: none;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.like-btn small {
  display: block;
  font-size: 12px;
}

/* Panel de perfil */

.profile-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #000;
  padding: 25px 20px;
}

.profile-panel.visible {
  display: block;
}

.profile-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.profile-header h2 {
  color: #00e5ff;
}

.close-profile {
  background: none;
  border: none;
  color: white;
  font-size: 28px;
}

.profile-avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #172b35;
  border: 2px solid #00e5ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  margin-bottom: 15px;
  overflow: hidden;
  position: relative;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

#iconoFotoPerfil {
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-email {
  color: #aaa;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

.logout-btn {
  width: 100%;
  padding: 14px;
  margin-top: 35px;
  background: #191919;
  border: 1px solid #ff4545;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
/* Panel de comentarios */

.panel-comentarios {
  display: none;
  position: fixed;
  bottom: 65px;
  left: 0;
  width: 100%;
  height: 65%;
  background: #101820;
  color: white;
  z-index: 999;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  overflow-y: auto;
}

.panel-comentarios.visible {
  display: block;
}

.comentarios-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.comentarios-header button {
  background: none;
  border: none;
  color: white;
  font-size: 28px;
}

.escribir-comentario {
  display: flex;
  gap: 8px;
  position: sticky;
  bottom: 0;
  background: #101820;
  padding-top: 10px;
}

.escribir-comentario input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 20px;
  border: none;
}

.escribir-comentario button {
  background: #00e5ff;
  color: black;
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
}
  
/* Diseño de comentarios NEXORA */

#listaComentarios {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 10px 0 20px;
}

#listaComentarios p {
  background: #18232d;
  border: 1px solid #263642;
  border-radius: 15px;
  padding: 14px;
  margin: 0;
  color: white;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#listaComentarios p::before {
  content: "♙";
  float: left;
  width: 38px;
  height: 38px;
  margin-right: 12px;
  border-radius: 50%;
  background: #263d4b;
  color: #00e5ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

#listaComentarios strong {
  display: block;
  color: #00e5ff;
  margin-bottom: 4px;
}

#listaComentarios span {
  display: block;
  color: #eeeeee;
}

.comment-btn {
  background: none;
  border: none;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.comment-btn small {
  display: block;
  font-size: 12px;
}

</style>
</head>

<body>

<header>
  <div class="logo">NEXORA</div>
  <div>⌕</div>
</header>

<main class="feed">

  <section class="post">
    <video class="video-real" autoplay muted playsinline loop>

      <button class="like-btn" data-post-id="video1" onclick="darLike(this)">

  <section class="post">

      <source src="20261002_155338_001.mp4" type="video/mp4">

    <div class="actions">
      <button class="like-btn" data-post-id="Video2" onclick="darLike(this)">

      <button class="comment-btn" onclick="abrirComentarios('Video2')">

      </button>

    </div>

    <div class="actions">
      <button class="like-btn" data-post-id="video3" onclick="darLike(this)">

      </button>
    <button class="comment-btn" onclick="abrirComentarios('video3')">
  💬 <small>0</small>
    </button>
      <span>↗<small>Compartir</small></span>
    </div>

    <div class="info">
      <strong>@usuario</strong>

</main>
  <!-- Ventana de comentarios -->

<div id="panelComentarios" class="panel-comentarios">

  <div class="comentarios-header">
    <h2>Comentarios</h2>
    <button onclick="cerrarComentarios()">×</button>
  </div>

  <div id="listaComentarios">

  <div class="escribir-comentario">
    <input
      type="text"

    >

  </div>

</div>

<nav>
  <button onclick="irInicio()"><b>⌂</b>Inicio</button>
  <button onclick="proximamente()"><b>⌕</b>Buscar</button>
  <button onclick="proximamente()"><b>＋</b>Crear</button>
  <button onclick="proximamente()"><b>♡</b>Actividad</button>
  <button onclick="abrirPerfil()"><b>♙</b>Perfil</button>
</nav>

<!-- Panel de perfil -->

<section class="profile-panel" id="profilePanel">

  <div class="profile-header">
    <h2>Mi perfil</h2>
    <button class="close-profile" onclick="cerrarPerfil()">×</button>
  </div>

  <div class="profile-avatar" id="contenedorFotoPerfil">

  <img id="fotoPerfil" src="" style="display:none;">

  <span id="iconoFotoPerfil">♙</span>

</div>

<button onclick="document.getElementById('selectorFotoPerfil').click()">
  📷 Cambiar foto
</button>

<input
  type="file"
  id="selectorFotoPerfil"
  accept="image/*"
  style="display:none;"
>

  <h2 id="nombrePerfil">@pedro</h2>

<p id="biografiaPerfil">
  Mi cuenta de NEXORA 🚀
</p>

  <button id="botonEditarPerfil">
  ✏️ Editar perfil
</button>

<div id="formularioEditarPerfil" style="display:none;">

  <input
    id="nuevoNombreUsuario"
    type="text"
    placeholder="Nombre de usuario"
    maxlength="20"
  >

  <textarea
    id="nuevaBiografia"
    placeholder="Escribe tu biografía"
    maxlength="150"
  ></textarea>

  <button id="guardarPerfil">
    Guardar cambios
  </button>

  <button id="cancelarEdicion">
    Cancelar
  </button>

</div>

<p class="profile-email" id="correoUsuario">
  Cargando cuenta...
</p>

  <button class="logout-btn" id="logoutBtn">
    Cerrar sesión
  </button>

</section>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  getDoc,
  collection,
  doc,
  onSnapshot,
  setDoc,
  deleteDoc,
  serverTimestamp,
  addDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAbLF8HxEFCGkn00Mzn_Q3JOPOc2lSkk7Y",
  authDomain: "nexora-c7a6f.firebaseapp.com",
  projectId: "nexora-c7a6f",
  storageBucket: "nexora-c7a6f.firebasestorage.app",
  messagingSenderId: "322230049221",
  appId: "1:322230049221:web:c54317e2aafd0a620053ac"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
  // Cargar perfil desde Firestore

async function cargarPerfil(user) {

  const perfilRef = doc(db, "usuarios", user.uid);

  try {

    const perfilSnap = await getDoc(perfilRef);

    if (perfilSnap.exists()) {

      const datos = perfilSnap.data();

      document.getElementById("nombrePerfil").textContent =
        "@" + datos.nombreUsuario;

      document.getElementById("biografiaPerfil").textContent =
        datos.biografia;

    }

  } catch (error) {

    console.error("Error al cargar perfil:", error);

  }

}
  
const botonEditarPerfil = document.getElementById("botonEditarPerfil");
const formularioEditarPerfil = document.getElementById("formularioEditarPerfil");
const nuevoNombreUsuario = document.getElementById("nuevoNombreUsuario");
const nuevaBiografia = document.getElementById("nuevaBiografia");
const guardarPerfil = document.getElementById("guardarPerfil");
const cancelarEdicion = document.getElementById("cancelarEdicion");

botonEditarPerfil.addEventListener("click", () => {
  alert("¡El botón Editar perfil funciona!");
  nuevoNombreUsuario.value =
    document.getElementById("nombrePerfil").textContent.replace(/^@/, "");

  nuevaBiografia.value =
    document.getElementById("biografiaPerfil").textContent;

  formularioEditarPerfil.style.display = "block";
});

cancelarEdicion.addEventListener("click", () => {
  formularioEditarPerfil.style.display = "none";
});

guardarPerfil.addEventListener("click", async () => {
  if (!usuarioActual) return;

  const nombre = nuevoNombreUsuario.value.trim().replace(/^@/, "");
  const bio = nuevaBiografia.value.trim();

  if (!nombre) {
    alert("Escribe un nombre de usuario.");
    return;
  }

  guardarPerfil.disabled = true;

  try {
    await setDoc(doc(db, "usuarios", usuarioActual.uid), {
      nombreUsuario: nombre,
      biografia: bio
    }, { merge: true });

    document.getElementById("nombrePerfil").textContent = "@" + nombre;
    document.getElementById("biografiaPerfil").textContent = bio;

    formularioEditarPerfil.style.display = "none";
    alert("¡Perfil actualizado correctamente!");

  } catch (error) {
    console.error("Error al guardar perfil:", error);
    alert(error.code + ": " + error.message);

  } finally {
    guardarPerfil.disabled = false;
  }
});



// Reproducción de videos

const videos = document.querySelectorAll(".video-real");

videos.forEach((video) => {
  video.addEventListener("click", () => {
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  });
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    const video = entry.target;

    if (entry.isIntersecting) {
      if (video.dataset.paused !== "true") {
        video.play().catch(() => {});
      }
    } else {
      video.pause();
      video.dataset.paused = "false";
    }
  });
}, {
  threshold: 0.6
});

videos.forEach((video) => {
  observer.observe(video);
});


// Sistema de Me gusta con Firebase

const botones = document.querySelectorAll(".like-btn");

botones.forEach((button) => {
  button.disabled = true;
});

let usuarioActual = null;
  
let publicacionActual = null;
let detenerComentarios = null;

window.abrirComentarios = function(postId) {
  publicacionActual = postId;

  const panel = document.getElementById("panelComentarios");
  const lista = document.getElementById("listaComentarios");

  panel.classList.add("visible");
  lista.innerHTML = "<p>Cargando comentarios...</p>";

  if (detenerComentarios) detenerComentarios();

  const comentariosRef = collection(
    db, "publicaciones", postId, "comentarios"
  );

  const consulta = query(comentariosRef, orderBy("createdAt", "asc"));

  detenerComentarios = onSnapshot(consulta, (snapshot) => {
    lista.innerHTML = "";

    const boton = [...document.querySelectorAll(".comment-btn")]
      .find(b => b.getAttribute("onclick") ===
        "abrirComentarios('" + postId + "')");

    if (boton) {
      boton.querySelector("small").textContent = snapshot.size;
    }

    if (snapshot.empty) {
      lista.innerHTML = "<p>Todavía no hay comentarios.</p>";
      return;
    }

    snapshot.forEach((documento) => {
      const comentario = documento.data();
      const elemento = document.createElement("p");
      const nombre = document.createElement("strong");
      const texto = document.createElement("span");

      nombre.textContent = "@" +
        (comentario.nombreUsuario || "usuario") + ": ";
      texto.textContent = comentario.texto;

      elemento.append(nombre, texto);
      elemento.style.marginBottom = "15px";
      lista.appendChild(elemento);
    });
  }, (error) => {
    console.error("Error al cargar comentarios:", error);
    lista.textContent = "No se pudieron cargar los comentarios.";
  });
};

window.cerrarComentarios = function() {
  document.getElementById("panelComentarios").classList.remove("visible");

  if (detenerComentarios) {
    detenerComentarios();
    detenerComentarios = null;
  }
};

window.enviarComentario = async function() {
  if (!usuarioActual || !publicacionActual) {
    alert("Inicia sesión para comentar.");
    return;
  }

  const campo = document.getElementById("textoComentario");
  const texto = campo.value.trim();

  if (!texto) {
    alert("Escribe un comentario.");
    return;
  }

  if (texto.length > 300) {
    alert("El comentario no puede superar 300 caracteres.");
    return;
  }

  try {
    const perfil = await getDoc(doc(db, "usuarios", usuarioActual.uid));

    const nombreUsuario = perfil.exists()
      ? perfil.data().nombreUsuario
      : "usuario";

    await addDoc(
      collection(db, "publicaciones", publicacionActual, "comentarios"),
      {
        uid: usuarioActual.uid,
        nombreUsuario: nombreUsuario,
        texto: texto,
        createdAt: serverTimestamp()
      }
    );

    campo.value = "";

  } catch (error) {
    console.error("Error al enviar comentario:", error);
    alert("No se pudo enviar el comentario. Inténtalo de nuevo.");
  }
};


async function darLike(button) {

  if (!usuarioActual || button.disabled) {
    return;
  }

  const postId = button.dataset.postId;
  const userId = usuarioActual.uid;

  const referencia = doc(
    db,
    "publicaciones",
    postId,
    "likes",
    userId
  );

  button.disabled = true;

  try {

    if (button.dataset.liked === "true") {

      await deleteDoc(referencia);

    } else {

      await setDoc(referencia, {
        uid: userId,
        createdAt: serverTimestamp()
      });

    }

  } catch (error) {

    console.error("Error al guardar Me gusta:", error);
    alert("No se pudo guardar el Me gusta. Inténtalo de nuevo.");

  } finally {

    button.disabled = false;

  }
}

window.darLike = darLike;


// Comprobar sesión y escuchar los Me gusta

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  usuarioActual = user;

  document.getElementById("correoUsuario").textContent =
    user.email || "Cuenta de Google";

  cargarPerfil(user);

  botones.forEach((button) => {

    const postId = button.dataset.postId;

    const likesRef = collection(
      db,
      "publicaciones",
      postId,
      "likes"
    );

    onSnapshot(likesRef, (snapshot) => {

      const total = snapshot.size;

      const miLike = snapshot.docs.some(
        (documento) => documento.id === user.uid
      );

      button.dataset.liked = miLike ? "true" : "false";

      const contador = button.querySelector("small");

      contador.textContent = total;

      button.firstChild.textContent = miLike ? "♥ " : "♡ ";

      button.style.color = miLike ? "#ff2d55" : "white";

      button.disabled = false;

    }, (error) => {

      console.error("Error al leer Me gusta:", error);
      button.disabled = true;

    });

  });

});


// Abrir y cerrar perfil

window.abrirPerfil = function() {
  document.getElementById("profilePanel").classList.add("visible");
};
  // Cambiar foto de perfil

const selectorFoto = document.getElementById("selectorFotoPerfil");
const fotoPerfil = document.getElementById("fotoPerfil");
const iconoFoto = document.getElementById("iconoFotoPerfil");

selectorFoto.addEventListener("change", function() {

  const archivo = selectorFoto.files[0];

  if (!archivo) return;

  if (!archivo.type.startsWith("image/")) {
    alert("Selecciona una imagen válida.");
    return;
  }

  const lector = new FileReader();

  lector.onload = function() {

    fotoPerfil.src = lector.result;
    fotoPerfil.style.display = "block";
    iconoFoto.style.display = "none";

    localStorage.setItem(
      "nexora_foto_perfil",
      lector.result
    );

  };

  lector.readAsDataURL(archivo);

});

window.cerrarPerfil = function() {
  document.getElementById("profilePanel").classList.remove("visible");
};
  // Cargar foto guardada

const fotoGuardada = localStorage.getItem("nexora_foto_perfil");

if (fotoGuardada) {
  fotoPerfil.src = fotoGuardada;
  fotoPerfil.style.display = "block";
  iconoFoto.style.display = "none";
}


// Volver al inicio

window.irInicio = function() {
  document.getElementById("profilePanel").classList.remove("visible");
  document.querySelector(".feed").scrollTo({
    top: 0,
    behavior: "smooth"
  });
};


// Cerrar sesión

document.getElementById("logoutBtn").addEventListener("click", async () => {

  const confirmar = confirm("¿Seguro que quieres cerrar sesión?");

  if (!confirmar) {
    return;
  }

  try {

    await signOut(auth);
    window.location.href = "login.html";

  } catch (error) {

    console.error("Error al cerrar sesión:", error);
    alert("No se pudo cerrar la sesión. Inténtalo de nuevo.");

  }

});


// Funciones que todavía están en desarrollo

window.proximamente = function() {
  alert("Esta función de NEXORA todavía está en desarrollo.");
};

</script>

</body>
</html>
