<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B12">
  <title>Crear cuenta - NEXORA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080B12;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: #111827;
      padding: 28px;
      border-radius: 20px;
    }
    h1 { color: #a78bfa; text-align: center; }
    p { color: #aab2c5; text-align: center; }
    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #080B12;
      color: white;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
    }
    a { color: #a78bfa; }
    #mensaje { font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NEXORA</h1>
    <p>Crea tu cuenta para comenzar</p>

    <form id="registroForm">
      <input id="nombre" type="text" placeholder="Tu nombre" required>
      <input id="correo" type="email" placeholder="Correo electrónico" required>
      <input id="password" type="password" placeholder="Contraseña" required minlength="6">
      <button type="submit">Crear cuenta</button>
    </form>

    <p id="mensaje"></p>
    <p>¿Ya tienes cuenta? <a href="index.html">Volver</a></p>
  </div>

  <script>
    document.getElementById("registroForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("mensaje").textContent =
        "La pantalla está lista. Ahora conectaremos el registro con Firebase.";
    });
  </script>
</body>
</html>
