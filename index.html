
<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <meta name="description" content="NEXORA - Comparte tus momentos.">
  <title>NEXORA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #252538;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #a78bfa;
    }

    main {
      padding: 25px 18px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-top: 70px;
    }

    p {
      color: #aaa;
      margin-top: 15px;
      line-height: 1.6;
    }

    .welcome {
      margin: 35px auto;
      padding: 30px 15px;
      background: #151525;
      border: 1px solid #292943;
      border-radius: 18px;
    }

    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NEXORA</div>
    <span>●</span>
  </header>

  <main>
    <div class="welcome">
      <h1>Bienvenido a NEXORA</h1>
      <p>
        Tu espacio para descubrir,
        compartir y conectar.
      </p>
      <button onclick="window.location.href='registro.html'">Comenzar</button>
    </div>
  </main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</body>
</html>
